# Nginx reverse proxy for Limyrx Chat (chat.limyrx.xyz)
# Place this in /etc/nginx/sites-available/limyrx
# Then: ln -s /etc/nginx/sites-available/limyrx /etc/nginx/sites-enabled/
# And:  nginx -t && systemctl reload nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Frontend (chat.limyrx.xyz)
server {
    listen 443 ssl http2;
    server_name chat.limyrx.xyz;

    ssl_certificate     /etc/letsencrypt/live/limyrx.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limyrx.xyz/privkey.pem;

    # Serve the built frontend
    root /path/to/for-web-main/packages/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# API (api.limyrx.xyz)
server {
    listen 443 ssl http2;
    server_name api.limyrx.xyz;

    ssl_certificate     /etc/letsencrypt/live/limyrx.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limyrx.xyz/privkey.pem;

    client_max_body_size 30M;

    limit_req zone=api burst=50 nodelay;

    location / {
        proxy_pass http://127.0.0.1:14702;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Events / WebSocket (events.limyrx.xyz)
server {
    listen 443 ssl http2;
    server_name events.limyrx.xyz;

    ssl_certificate     /etc/letsencrypt/live/limyrx.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limyrx.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:14703;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

